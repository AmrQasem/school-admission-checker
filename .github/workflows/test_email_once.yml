name: One-off Email Test
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        env:
          EMAIL_SENDER: dohasaeed61@gmail.com
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: "amrkasem47@yahoo.com,dohasaeed61@gmail.com"
        run: |
          python3 - << 'PYEOF'
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          sender = os.environ["EMAIL_SENDER"]
          password = os.environ["EMAIL_APP_PASSWORD"]
          recipients = os.environ["EMAIL_RECIPIENTS"].split(",")

          msg = MIMEMultipart()
          msg["From"] = sender
          msg["To"] = ", ".join(recipients)
          msg["Subject"] = "test ok - school admissions monitor"
          msg.attach(MIMEText(
              "This confirms the email channel for the school admissions monitor works correctly.\n"
              "رسالة اختبار تؤكد ان قناة الايميل شغالة تمام لمتابعة فتح باب التقديم للمدارس.",
              "plain", "utf-8"))

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context) as server:
              server.login(sender, password)
              server.sendmail(sender, recipients, msg.as_string())
          print("EMAIL TEST: SUCCESS")
          PYEOF
